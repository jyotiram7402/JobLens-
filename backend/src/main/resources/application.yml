spring:
  application:
    name: joblens-api

  datasource:
    # DB_URL_PARAMS carries provider-specific extras, e.g. "?sslmode=require"
    # when connecting to a managed database over the public internet.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:joblens}${DB_URL_PARAMS:}
    username: ${DB_USERNAME:joblens}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  # PORT is injected by most PaaS providers (Render, Railway, Fly).
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

joblens:
  version: ${APP_VERSION:0.1.0-SNAPSHOT}
  cors:
    # Comma-separated list. Local Vite dev server by default.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.joblens: ${LOG_LEVEL_JOBLENS:INFO}
