# Local development.
#
# Every value here has a default that works against the PostgreSQL container in
# docker/docker-compose.yml, so `mvn spring-boot:run` works with no environment
# set up at all. These defaults are safe precisely because they are useless
# anywhere else: they point at localhost with a throwaway password.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:joblens}${DB_URL_PARAMS:}
    username: ${DB_USERNAME:joblens}
    password: ${DB_PASSWORD:joblens}

  flyway:
    # Real migrations plus development-only seed data. The prod profile leaves
    # db/seed out entirely, so seeded rows can never reach a real database.
    locations: classpath:db/migration,classpath:db/seed

  jpa:
    # Statement logging is on in development only. It is noisy, it slows things
    # down, and query text can contain user data -- none of which belongs in a
    # production log.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

joblens:
  jwt:
    # Local-only placeholder so `mvn spring-boot:run` needs no setup. It is
    # committed, therefore public, therefore worthless as a secret -- which is
    # exactly why it is written to be obviously unusable rather than to look
    # plausible. The prod profile has no default at all and refuses to start
    # without a real JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-do-not-deploy-this-anywhere}

  environment: ${JOBLENS_ENVIRONMENT:dev}
  cors:
    # The Vite dev server.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    com.joblens: DEBUG
    # Bind parameters, so a failing query can be reproduced by hand.
    org.hibernate.orm.jdbc.bind: TRACE
