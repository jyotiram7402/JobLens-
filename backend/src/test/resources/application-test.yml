# Automated tests.
#
# Integration tests run against a real PostgreSQL instance -- the container in
# docker/docker-compose.yml locally, a service container in GitHub Actions.
# An in-memory database would be faster and would also behave differently from
# the thing we deploy, which is exactly what an integration test is for.

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:joblens_test}
    username: ${DB_USERNAME:joblens}
    password: ${DB_PASSWORD:joblens}

  jpa:
    show-sql: false

joblens:
  jwt:
    # Test-only placeholder. Long enough to satisfy the 256-bit minimum that
    # JwtService enforces at startup.
    secret: test-only-insecure-jwt-secret-used-exclusively-by-the-test-suite
    expiration: 1h

  environment: test
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    root: WARN
    com.joblens: INFO
