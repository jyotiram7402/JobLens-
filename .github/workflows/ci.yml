name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: joblens_test
          POSTGRES_USER: joblens
          POSTGRES_PASSWORD: joblens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U joblens -d joblens_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: joblens_test
          DB_USERNAME: joblens
          DB_PASSWORD: joblens
        run: mvn --batch-mode verify

  frontend:
    name: Frontend (install + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm ci` and setup-node's npm cache both require a committed
      # package-lock.json. The lockfile can only be produced by running npm,
      # which the authoring machine cannot do. Once it has been generated on a
      # permitted machine and committed, switch this step to `npm ci` and add
      # `cache: npm` above -- it is faster and reproducible.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: npm run build
