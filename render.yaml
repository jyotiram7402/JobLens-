# Render blueprint for the JobLens backend.
#
# The database is deliberately NOT created here. Render's free PostgreSQL
# expires 30 days after creation (with a 14-day grace period, then deletion),
# which is a poor fit for a portfolio project that needs to stay up. We use an
# external provider with a permanent free tier instead -- Neon by default -- and
# pass its credentials in as environment variables. See docs/DEPLOYMENT.md.
#
# Every DB_* variable is `sync: false`, so Render prompts for it and nothing
# sensitive is ever committed.
#
# Free-tier facts change. Verify before relying on them. As last checked:
#   - free web service: 512 MB RAM, 0.1 CPU, 750 instance hours/month,
#     spins down after ~15 minutes idle and takes up to a minute to wake.
#   - 500 build minutes and 100 GB bandwidth per month.
# If Render stops working for us, backend/Dockerfile runs anywhere.

services:
  - type: web
    name: joblens-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Managed databases reached over the public internet require TLS.
      - key: DB_URL_PARAMS
        value: "?sslmode=require"
      # A 256 MB free database cannot serve many connections, and a 512 MB
      # service does not need them.
      - key: DB_POOL_SIZE
        value: "3"
      # Set to the deployed frontend origin, e.g. https://joblens.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JOBLENS_ENVIRONMENT
        value: production
      - key: APP_VERSION
        value: 0.1.0-SNAPSHOT
